name: validate

# Checks the published manifests: validates them against Scoop's JSON schema,
# then installs each one from this checkout with a real `scoop install`
# (which verifies the hash) and runs the binary.
# Manifests are generated by GoReleaser in ks1686/genv and ks1686/peaproxy, so
# this workflow only reports problems; fixes belong in those repos.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  # ScoopInstaller/Scoop commit the schema is read from (master 2026-10-13).
  SCOOP_SCHEMA_REF: e6aa3b366bdee8ed138c1e0f7b85192ebdd35d0f

jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate manifests against the Scoop schema
        run: |
          $schema = Join-Path $env:RUNNER_TEMP 'scoop-schema.json'
          Invoke-WebRequest "https://raw.githubusercontent.com/ScoopInstaller/Scoop/$env:SCOOP_SCHEMA_REF/schema.json" -OutFile $schema
          $failed = $false
          foreach ($m in Get-ChildItem -Path . -Filter *.json -File) {
            if (Test-Json -Path $m.FullName -SchemaFile $schema) { "ok: $($m.Name)" }
            else { "invalid: $($m.Name)"; $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Install Scoop
        run: |
          iex "& {$(irm get.scoop.sh)} -RunAsAdmin"
          Join-Path $env:USERPROFILE 'scoop\shims' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install manifests and run the binaries
        run: |
          scoop bucket add ks1686 $env:GITHUB_WORKSPACE
          foreach ($app in 'genv', 'peaproxy') {
            scoop install "ks1686/$app"
            if ($LASTEXITCODE) { throw "scoop install $app failed" }
            $want = (Get-Content "$app.json" -Raw | ConvertFrom-Json).version
            $got = (& $app --version | Select-Object -First 1)
            "$app --version: $got"
            if ($got -ne "$app $want") { throw "$app: expected '$app $want', got '$got'" }
          }
